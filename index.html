<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM HACKED</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #000;
            color: #00ff00;
            font-family: Consolas, monospace;
            overflow-y: auto;
        }

        .warning {
            color: red;
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        #matrix {
            white-space: pre-wrap;
            line-height: 1.5;
        }
    </style>
</head>

<body>

<div class="warning">
⚠️ WARNING: SYSTEM BREACH DETECTED ⚠️
</div>

<div id="matrix"></div>

<script>
const matrix = document.getElementById("matrix");

const chars = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ$#@%&";

function generateRandomData() {
    let line = "";

    for (let i = 0; i < 50; i++) {
        line += chars[Math.floor(Math.random() * chars.length)] + " ";
    }

    matrix.insertAdjacentHTML("beforeend", line + "<br>");

    while (matrix.childNodes.length > 120) {
        matrix.removeChild(matrix.firstChild);
    }

    window.scrollTo(0, document.body.scrollHeight);
}

setInterval(generateRandomData, 30);
</script>

</body>
</html>
