<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Quacks Community</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>

    <h1>🦆 Quacks Community</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
    </nav>

</header>



<section class="hero">

    <h2>Create Account</h2>


    <form>


        <input 
        type="text"
        placeholder="Username"
        required>


        <br><br>


        <input 
        type="email"
        placeholder="Email"
        required>


        <br><br>


        <input 
        type="password"
        placeholder="Password"
        required>


        <br><br>


        <button class="button">
            Create Account
        </button>


    </form>



    <p>
        Already have an account?
        <a href="login.html">
            Login
        </a>
    </p>


</section>



<script src="js/main.js"></script>


</body>

</html>
