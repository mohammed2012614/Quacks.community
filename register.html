<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register | Quacks Community</title>


<link rel="stylesheet" href="css/style.css">


</head>


<body class="auth-page">


<div class="auth-box">


<div class="logo">
🦆
</div>


<h1>Create Account</h1>


<p class="subtitle">
Join the Quacks Community
</p>



<form>


<div class="input-box">

<input type="text" required>

<label>Username</label>

</div>



<div class="input-box">

<input type="email" required>

<label>Email</label>

</div>



<div class="input-box">

<input type="password" required>

<label>Password</label>

</div>



<button class="auth-button">

Create Account

</button>



</form>



<div class="line">
OR
</div>


<button class="discord-button">
🎮 Sign up with Discord
</button>



<p class="bottom-text">

Already have an account?

<a href="login.html">
Login
</a>

</p>


</div>


</body>

</html>
