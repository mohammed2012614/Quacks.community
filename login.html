<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Quacks Community</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body class="login-page">


<div class="login-container">


    <div class="welcome-panel">

        <div class="shapes"></div>

        <div class="welcome-content">

            <div class="logo">
                🦆
            </div>

            <h1>
                Welcome to<br>
                Quacks Community
            </h1>

            <p>
                Connect. Play. Compete.
                <br><br>
                Join the gaming community,
                discover events, servers and
                new friends.
            </p>

        </div>

    </div>




    <div class="form-panel">


        <form class="login-form">


            <h2>
                USER LOGIN
            </h2>



            <div class="input-group">

                <span>👤</span>

                <input
                id="username"
                type="text"
                placeholder="Username"
                required>

            </div>




            <div class="input-group">

                <span>🔒</span>

                <input
                id="password"
                type="password"
                placeholder="Password"
                required>

            </div>




            <div class="options">


                <label>

                    <input type="checkbox">

                    Remember me

                </label>



                <a href="#">
                    Forgot password?
                </a>


            </div>




            <button 
            type="button"
            class="login-button"
            onclick="loginUser()">

                LOGIN

            </button>



        </form>


    </div>


</div>



<script src="js/auth.js"></script>


</body>

</html>
